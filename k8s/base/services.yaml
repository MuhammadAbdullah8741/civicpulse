apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: civicpulse
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: civicpulse
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: civicpulse
spec:
  type: ClusterIP
  selector:
    app: database
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: civicpulse
spec:
  type: ClusterIP
  selector:
    app: cache
  ports:
  - port: 6379
    targetPort: 6379
