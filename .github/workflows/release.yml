name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag and main ancestry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require stable semantic version on main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "This version already has a release; use a new version." >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Use a stable semantic version such as v1.0.0.' >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  delivery:
    name: Test, publish version and deploy
    needs: validate-tag
    uses: ./.github/workflows/cd.yml
    permissions:
      contents: read
      packages: write
    with:
      release_tag: ${{ github.ref_name }}

  release-notes:
    name: Publish release notes and SBOM assets
    needs: delivery
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: delivery-images
          path: delivery-artifacts
      - name: Generate release notes and attach image evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; preserve its published assets.'
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "CivicPulse $GITHUB_REF_NAME" \
            delivery-artifacts/images.json \
            delivery-artifacts/backend.spdx.json \
            delivery-artifacts/frontend.spdx.json
