# Standalone deployment file. Do not merge with development Compose.
name: civicpulse-prod
services:
  database:
    image: ${POSTGRES_IMAGE:?Run scripts/Prepare-Production.ps1 first}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
    - pgdata:/var/lib/postgresql/data
    networks:
    - internal
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  cache:
    image: ${REDIS_IMAGE:?Run scripts/Prepare-Production.ps1 first}
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redisdata:/data
    networks:
    - internal
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  backend:
    image: ${BACKEND_IMAGE_REPOSITORY:-civicpulse-backend}:${IMAGE_TAG:?Set a sha-commit
      image tag}
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://cache:6379/0
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-simulated}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    networks:
    - edge
    - internal
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    command:
    - python
    - -m
    - uvicorn
    - app.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --timeout-graceful-shutdown
    - '35'
    - --log-config
    - logging.json
    - --no-access-log
    - --no-proxy-headers
    stop_grace_period: 45s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',
        timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
  ollama:
    image: ollama/ollama:0.34.4
    profiles:
    - local-ai
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NUM_PARALLEL: '1'
    volumes:
    - ollama_models:/root/.ollama
    networks:
    - edge
    healthcheck:
      test:
      - CMD
      - ollama
      - list
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
  frontend:
    image: ${FRONTEND_IMAGE_REPOSITORY:-civicpulse-frontend}:${IMAGE_TAG:?Set a sha-commit
      image tag}
    environment:
      BACKEND_UPSTREAM: backend:8000
    networks:
    - edge
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    ports:
    - 127.0.0.1:${FRONTEND_PORT:-8081}:8080
networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true
volumes:
  pgdata: null
  redisdata: null
  ollama_models: null
