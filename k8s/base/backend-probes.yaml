{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "backend",
    "namespace": "civicpulse"
  },
  "spec": {
    "template": {
      "spec": {
        "containers": [
          {
            "name": "backend",
            "livenessProbe": {
              "timeoutSeconds": 5,
              "periodSeconds": 10,
              "failureThreshold": 6
            }
          }
        ]
      }
    }
  }
}
