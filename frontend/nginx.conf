worker_processes auto;
pid /tmp/civicpulse-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format structured escape=json '{"source":"nginx","request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
    access_log /dev/stdout structured;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        set $backend "http://${BACKEND_UPSTREAM}";
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location /api/ {
            proxy_pass $backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_next_upstream off;
            proxy_cache off;
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store";
        }
    }
}
