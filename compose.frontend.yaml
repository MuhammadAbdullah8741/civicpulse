# Temporary integration overlay; merge frontend into the main Compose files later.
services:
  frontend:
    image: civicpulse-frontend:dev
    build:
      context: ./frontend
      target: runtime
    environment:
      BACKEND_UPSTREAM: backend:8000
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
